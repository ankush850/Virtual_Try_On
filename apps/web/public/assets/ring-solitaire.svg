<svg xmlns="http://www.w3.org/2000/svg" width="160" height="200" viewBox="0 0 160 200" fill="none">
  <defs>
    <linearGradient id="ringGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fae17d"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a6a12"/>
    </linearGradient>
    <radialGradient id="ringDiamond" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f0f9ff"/>
      <stop offset="80%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </radialGradient>
  </defs>
  <!-- Circular Finger Band -->
  <ellipse cx="80" cy="120" rx="48" ry="48" stroke="url(#ringGold)" stroke-width="12" fill="none"/>
  <!-- Crown Bridge / Gallery -->
  <rect x="68" y="60" width="24" height="14" rx="2" fill="url(#ringGold)"/>
  <!-- 4 Prongs -->
  <line x1="62" y1="64" x2="56" y2="34" stroke="url(#ringGold)" stroke-width="4" stroke-linecap="round"/>
  <line x1="98" y1="64" x2="104" y2="34" stroke="url(#ringGold)" stroke-width="4" stroke-linecap="round"/>
  <!-- Solitaire Gemstone -->
  <polygon points="80,16 110,42 98,62 62,62 50,42" fill="url(#ringDiamond)" stroke="#ffffff" stroke-width="1.5"/>
  <polygon points="80,24 100,42 80,56 60,42" fill="#ffffff" fill-opacity="0.5"/>
</svg>
