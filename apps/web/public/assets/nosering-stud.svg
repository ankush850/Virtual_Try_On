<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="noseDiamond" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </radialGradient>
    <linearGradient id="noseBezel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fae17d"/>
      <stop offset="70%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a6a12"/>
    </linearGradient>
  </defs>
  <!-- Bezel gold rim -->
  <circle cx="50" cy="50" r="28" fill="url(#noseBezel)" stroke="#8a6a12" stroke-width="2"/>
  <!-- Faceted floral nose pin center -->
  <polygon points="50,26 68,36 74,50 68,64 50,74 32,64 26,50 32,36" fill="url(#noseDiamond)" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="50" cy="50" r="8" fill="#ffffff" fill-opacity="0.9"/>
  <!-- 4 Delicate Granules -->
  <circle cx="50" cy="18" r="3" fill="url(#noseBezel)"/>
  <circle cx="82" cy="50" r="3" fill="url(#noseBezel)"/>
  <circle cx="50" cy="82" r="3" fill="url(#noseBezel)"/>
  <circle cx="18" cy="50" r="3" fill="url(#noseBezel)"/>
</svg>
