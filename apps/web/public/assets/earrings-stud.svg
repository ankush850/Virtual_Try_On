<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" fill="none">
  <defs>
    <radialGradient id="studDiamond" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#f0f8ff"/>
      <stop offset="85%" stop-color="#d0e8f8"/>
      <stop offset="100%" stop-color="#90b8d8"/>
    </radialGradient>
    <linearGradient id="studGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fae17d"/>
      <stop offset="70%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
  </defs>
  <!-- 4 Crown Prongs -->
  <circle cx="80" cy="80" r="48" fill="url(#studGold)" stroke="#8a6a12" stroke-width="2"/>
  <!-- Main Brilliant Facets -->
  <polygon points="80,36 112,48 124,80 112,112 80,124 48,112 36,80 48,48" fill="url(#studDiamond)" stroke="#ffffff" stroke-width="1.5"/>
  <polygon points="80,52 100,60 108,80 100,100 80,108 60,100 52,80 60,60" fill="#ffffff" fill-opacity="0.45" stroke="#a0c4e4" stroke-width="1"/>
  <!-- 4 Corner Gold Prongs -->
  <circle cx="48" cy="48" r="6" fill="url(#studGold)"/>
  <circle cx="112" cy="48" r="6" fill="url(#studGold)"/>
  <circle cx="112" cy="112" r="6" fill="url(#studGold)"/>
  <circle cx="48" cy="112" r="6" fill="url(#studGold)"/>
</svg>
