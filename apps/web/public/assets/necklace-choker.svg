<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200" viewBox="0 0 320 200" fill="none">
  <defs>
    <linearGradient id="chokerGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fae17d"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a6a12"/>
    </linearGradient>
    <radialGradient id="emerald" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </radialGradient>
  </defs>
  <!-- Main Collar Arc -->
  <path d="M40 30 Q160 140 280 30" stroke="url(#chokerGold)" stroke-width="10" stroke-linecap="round" fill="none"/>
  <!-- Secondary Inner Gold Bead String -->
  <path d="M60 45 Q160 130 260 45" stroke="url(#chokerGold)" stroke-width="4" stroke-dasharray="2 8" stroke-linecap="round" fill="none"/>
  <!-- Pendant Bail -->
  <rect x="154" y="96" width="12" height="16" rx="3" fill="url(#chokerGold)"/>
  <!-- Emerald Centerpiece -->
  <polygon points="160,116 178,136 178,168 160,188 142,168 142,136" fill="url(#emerald)" stroke="url(#chokerGold)" stroke-width="3"/>
  <!-- Diamond Halo Accent -->
  <circle cx="160" cy="116" r="4" fill="#ffffff"/>
  <circle cx="178" cy="136" r="3.5" fill="#ffffff"/>
  <circle cx="178" cy="168" r="3.5" fill="#ffffff"/>
  <circle cx="160" cy="188" r="4" fill="#ffffff"/>
  <circle cx="142" cy="168" r="3.5" fill="#ffffff"/>
  <circle cx="142" cy="136" r="3.5" fill="#ffffff"/>
</svg>
